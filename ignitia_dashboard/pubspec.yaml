name: ignitia_dashboard
description: Admin dashboard for the ignitia attendance management system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.3
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  json_annotation: ^4.12.0
  intl: ^0.18.0
  trina_grid: 1.4.15
  dropdown_search: ^5.0.2
  fluttertoast: ^8.0.9
  flutter_spinkit: ^5.1.0
  google_fonts: ^6.2.1
  marquee: ^2.2.3
  omni_datetime_picker: ^2.0.4
  switcher: ^1.0.0
  shared_preferences: ^2.0.15
  url_launcher: ^6.1.6
  whatsapp_unilink: ^2.0.2
  fl_chart: ^1.2.0
  supabase_flutter: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.10
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/


